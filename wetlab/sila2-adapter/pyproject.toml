[project]
name = "sila2-adapter"
version = "0.1.0"
description = "SiLA2 adapter: unified Feature interface layer for lab hardware communication"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sila2_adapter"]
