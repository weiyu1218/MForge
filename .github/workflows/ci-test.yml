name: CI · Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --all-extras
      - run: uv run pytest tests/unit -n auto -m unit --cov=libs --cov=services --cov=agents

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --all-extras
      - name: Boot test stack
        run: docker compose -f infra/docker/docker-compose.test.yml up -d
      - name: Run integration tests
        run: uv run pytest tests/integration -m integration
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.test.yml down -v
