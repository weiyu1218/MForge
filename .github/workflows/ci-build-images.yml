name: CI Build Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image chain
        working-directory: moleculeforge
        env:
          PUBLISH_REGISTRY: ghcr.io/${{ github.repository }}
          PUBLISH_TAG: ${{ github.sha }}
        run: ./infra/scripts/build_all_images.sh
