[project]
name = "mf-encoders-humu-pocket"
version = "0.1.0"
description = "HUMU Pocket Encoder: Encodes protein binding pocket geometry into Lorentz embeddings"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
    "torch>=2.6",
]

[project.entry-points."moleculeforge.encoders"]
humu_pocket = "mf_encoders.humu_pocket.encoder:HUMUPocketEncoder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_encoders"]
