[project]
name = "mf-oracles-rdkit-oracle"
version = "0.1.0"
description = "RDKit L0 oracle: SA score, QED, Lipinski, composite scoring"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_oracles"]
