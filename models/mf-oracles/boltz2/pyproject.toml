[project]
name = "mf-oracles-boltz2"
version = "0.1.0"
description = "Boltz2: Binding free energy prediction via ensemble docking"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "numpy",
]

[project.entry-points."moleculeforge.oracles"]
boltz2 = "mf_oracles.boltz2.oracle:Boltz2Oracle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_oracles"]
