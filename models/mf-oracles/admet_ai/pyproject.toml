[project]
name = "mf-oracles-admet-ai"
version = "0.1.0"
description = "ADMET-AI: L1 ADMET property prediction"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "numpy",
]

[project.entry-points."moleculeforge.oracles"]
admet_ai = "mf_oracles.admet_ai.oracle:ADMETAIOracle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_oracles"]
