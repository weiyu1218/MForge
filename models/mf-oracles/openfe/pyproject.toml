[project]
name = "mf-oracles-openfe"
version = "0.1.0"
description = "OpenFE: L3 Free Energy Perturbation calculations"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "numpy",
]

[project.entry-points."moleculeforge.oracles"]
openfe = "mf_oracles.openfe.oracle:OpenFEOracle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_oracles"]
