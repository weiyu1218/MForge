apiVersion: v1
kind: Namespace
metadata:
  name: mf-generators
  labels:
    app.kubernetes.io/part-of: moleculeforge
    moleculeforge.io/tier: generators
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: generators-quota
  namespace: mf-generators
spec:
  hard:
    requests.nvidia.com/gpu: "22"
    limits.nvidia.com/gpu: "22"
    requests.cpu: "32"
    requests.memory: 256Gi
    limits.cpu: "64"
    limits.memory: 512Gi
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: generators-limits
  namespace: mf-generators
spec:
  limits:
    - default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: "1"
        memory: 2Gi
      type: Container
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: generators-netpol
  namespace: mf-generators
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: moleculeforge
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: moleculeforge
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
