apiVersion: v1
kind: Namespace
metadata:
  name: mf-mlops
  labels:
    app.kubernetes.io/part-of: moleculeforge
    moleculeforge.io/tier: mlops
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mlops-quota
  namespace: mf-mlops
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 32Gi
    limits.cpu: "16"
    limits.memory: 64Gi
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mlops-limits
  namespace: mf-mlops
spec:
  limits:
    - default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: "1"
        memory: 2Gi
      type: Container
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlops-netpol
  namespace: mf-mlops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: moleculeforge
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: moleculeforge
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
