[project]
name = "supply-agent"
version = "0.1.0"
description = "Supply Chain Oracle (Agent-6): BB accessibility scoring"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-agents",
    "rdkit",
]

[project.entry-points."moleculeforge.agents"]
supply = "supply_agent.agent:SupplyAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supply_agent"]
