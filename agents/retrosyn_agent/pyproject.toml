[project]
name = "retrosyn-agent"
version = "0.1.0"
description = "RetroSyn Agent (Agent-3): 3-layer retrosynthesis planning"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-agents",
    "rdkit",
]

[project.entry-points."moleculeforge.agents"]
retrosyn = "retrosyn_agent.agent:RetroSynAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrosyn_agent"]
