[project]
name = "generator-finetune"
version = "0.1.0"
description = "Generator online fine-tuning pipeline — LoRA adapters from Pareto front"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
    "torch>=2.6",
    "peft>=0.11",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator_finetune"]
