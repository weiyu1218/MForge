[project]
name = "reaction-indexing"
version = "0.1.0"
description = "Reaction indexing pipeline: template extraction and indexing for retrosynthesis"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reaction_indexing"]
