[project]
name = "humu-pretrain"
version = "0.1.0"
description = "HUMU joint manifold co-generation pre-training pipeline"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
    "torch>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humu_pretrain"]
