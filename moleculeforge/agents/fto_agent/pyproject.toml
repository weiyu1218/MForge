[project]
name = "fto-agent"
version = "0.1.0"
description = "FTO/Patent Agent (Agent-5): Freedom-to-operate and IP safety"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-agents",
    "rdkit",
    "httpx",
]

[project.entry-points."moleculeforge.agents"]
fto = "fto_agent.agent:FTOAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fto_agent"]
