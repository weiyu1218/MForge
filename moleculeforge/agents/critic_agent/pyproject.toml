[project]
name = "critic-agent"
version = "0.1.0"
description = "Scientific Critic Agent (Agent-7): internal adversary for bias prevention"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-agents",
    "rdkit",
]

[project.entry-points."moleculeforge.agents"]
critic = "critic_agent.agent:ScientificCriticAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/critic_agent"]
