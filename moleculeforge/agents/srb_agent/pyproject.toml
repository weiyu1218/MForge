[project]
name = "srb-agent"
version = "0.1.0"
description = "Synthesis Reality Bridge Agent: compiles retrosynthesis routes into Structured Synthesis Protocols"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-agents",
]

[project.entry-points."moleculeforge.agents"]
srb = "srb_agent.agent:SRBAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srb_agent"]
