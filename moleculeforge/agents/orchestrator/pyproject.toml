[project]
name = "orchestrator"
version = "0.1.0"
description = "LangGraph state machine for the full molecular design workflow"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
