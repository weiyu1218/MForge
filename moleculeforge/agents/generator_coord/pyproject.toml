[project]
name = "generator-coord"
version = "0.1.0"
description = "Generator Coordinator (Agent-2): generation task orchestration"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-agents",
    "mf-generators-uas",
    "grpcio>=1.60",
]

[project.entry-points."moleculeforge.agents"]
generator_coord = "generator_coord.agent:GeneratorCoordAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator_coord"]
