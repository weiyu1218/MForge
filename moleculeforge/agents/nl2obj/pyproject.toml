[project]
name = "nl2obj"
version = "0.1.0"
description = "NL2Obj Agent (Agent-1): Intent resolution and CIG compilation"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-agents",
    "cig-compiler-svc",
    "httpx",
]

[project.entry-points."moleculeforge.agents"]
nl2obj = "nl2obj.agent:NL2ObjAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2obj"]
