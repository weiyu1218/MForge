[project]
name = "mf-agents"
version = "0.1.0"
description = "Agent framework: Redis bus, lineage, LLM clients, CRG, LangGraph helpers"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-telemetry",
    "redis>=5.0",
    "neo4j>=5.20",
    "anthropic>=0.30",
    "openai>=1.30",
    "tenacity>=8.3",
    "langgraph>=0.0.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_agents"]
