[project]
name = "mf-humu"
version = "0.1.0"
description = "MoleculeForge hyperbolic manifold math, encoders, GP, and operations"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "torch>=2.6",
    "numpy>=1.26",
    "geoopt>=0.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_humu"]
