[project]
name = "mf-core"
version = "0.1.0"
description = "MoleculeForge core types, plugin ABCs, and proto-generated stubs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "protobuf>=6.31.1",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "neo4j>=5.0",
    "qdrant-client>=1.12,<1.14",
    "aiobotocore>=2.0",
]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_core"]
