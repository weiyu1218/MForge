syntax = "proto3";

package moleculeforge.v1.agent;

// OrchestratorState represents the current state of the LangGraph workflow.
message OrchestratorState {
  string project_id = 1;
  string run_id = 2;
  string current_node = 3;              // Active workflow node name
  int32 cycle_count = 4;                // Number of mini-cycles executed
  int32 max_cycles = 5;                 // Hard limit to prevent infinite loops
  repeated string visited_nodes = 6;    // Ordered list of nodes visited
  repeated string pending_actions = 7;  // Actions queued for execution
  string status = 8;                    // "running", "awaiting_critic", "converged", "failed"
  int64 started_at_ns = 9;
  int64 last_updated_ns = 10;
}

// NL2ObjRequest is the natural language to objective specification request.
message NL2ObjRequest {
  string project_id = 1;
  string natural_language_prompt = 2;   // User's design intent in plain English
  map<string, string> context = 3;      // Additional context (target protein, etc.)
}

message ObjectiveSpec {
  string name = 1;
  string description = 2;
  string direction = 3;
  double target_value = 4;
  string unit = 5;
  string priority = 6;
}

message NL2ObjResponse {
  string project_id = 1;
  string nl_query = 2;
  repeated ObjectiveSpec objectives = 3;
  map<string, string> constraints = 4;
  double confidence = 5;
  string parsed_intent = 6;
  int64 elapsed_ms = 7;
}

message NL2ObjRefineRequest {
  string project_id = 1;
  repeated ObjectiveSpec objectives = 2;
  string feedback = 3;
}

message NL2ObjRefineResponse {
  repeated ObjectiveSpec objectives = 1;
  string feedback_applied = 2;
  double confidence = 3;
}

// OrchestrationDecision represents the orchestrator's next action.
message OrchestrationDecision {
  string decision = 1;                  // "continue", "refine", "accept", "reject", "escalate"
  string reasoning = 2;                 // Natural language explanation
  repeated string next_agents = 3;      // Agents to activate next
  string target_molecule_id = 4;        // Which molecule to act on
  map<string, string> parameters = 5;   // Action parameters
}

message StartPipelineRequest {
  string project_id = 1;
  string nl_input = 2;
  repeated string objectives = 3;
  string workflow_scope = 4;
  string run_id = 5;
  string trace_id = 6;
  optional bool validation_passed = 7;
  optional int32 max_refinements = 8;
  optional string validation_policy_json = 9;
  optional string teacher_policy_json = 10;
  optional string selection_policy_json = 11;
  optional string external_evidence_json = 12;
}

message PipelineResponse {
  string design_id = 1;
  string run_id = 2;
  string trace_id = 3;
  string project_id = 4;
  string status = 5;
  int32 n_objectives = 6;
}

message PipelineStateRequest {
  string design_id = 1;
}

message PipelineStateResponse {
  string design_id = 1;
  string current_stage = 2;
  string state_json = 3;
}

service NL2ObjService {
  rpc Parse(NL2ObjRequest) returns (NL2ObjResponse);
  rpc Refine(NL2ObjRefineRequest) returns (NL2ObjRefineResponse);
}

service OrchestratorService {
  rpc StartPipeline(StartPipelineRequest) returns (PipelineResponse);
  rpc GetPipelineState(PipelineStateRequest) returns (PipelineStateResponse);
}
