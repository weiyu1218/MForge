syntax = "proto3";

package moleculeforge.v1.agent;

// NL2ObjRequest is the natural language to objective specification request.
message NL2ObjRequest {
  string project_id = 1;
  string natural_language_prompt = 2;   // User's design intent in plain English
  map<string, string> context = 3;      // Additional context (target protein, etc.)
}

message ObjectiveSpec {
  string name = 1;
  string description = 2;
  string direction = 3;
  double target_value = 4;
  string unit = 5;
  string priority = 6;
}

message NL2ObjResponse {
  string project_id = 1;
  string nl_query = 2;
  repeated ObjectiveSpec objectives = 3;
  map<string, string> constraints = 4;
  double confidence = 5;
  string parsed_intent = 6;
  int64 elapsed_ms = 7;
}

message NL2ObjRefineRequest {
  string project_id = 1;
  repeated ObjectiveSpec objectives = 2;
  string feedback = 3;
}

message NL2ObjRefineResponse {
  repeated ObjectiveSpec objectives = 1;
  string feedback_applied = 2;
  double confidence = 3;
}

service NL2ObjService {
  rpc Parse(NL2ObjRequest) returns (NL2ObjResponse);
  rpc Refine(NL2ObjRefineRequest) returns (NL2ObjRefineResponse);
}
