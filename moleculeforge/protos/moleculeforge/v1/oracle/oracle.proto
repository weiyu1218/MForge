syntax = "proto3";

package moleculeforge.v1.oracle;

import "moleculeforge/v1/core/audit.proto";

// OracleLevel defines the fidelity tier.
enum OracleLevel {
  ORACLE_LEVEL_UNSPECIFIED = 0;
  L0_RDKIT = 1;         // QED, SAscore, logP (fast, local)
  L1_ML_SURROGATE = 2;  // ADMET-AI, Boltz-2 surrogate (GPU inference)
  L2_DOCKING = 3;       // DiffDock-L, Gnina (docking, medium cost)
  L3_FEP = 4;           // OpenFE alchemical FEP (expensive, accurate)
  L4_WETLAB = 5;        // Actual wet-lab measurement (gold standard)
}

enum OracleOutcome {
  ORACLE_OUTCOME_UNSPECIFIED = 0;
  ORACLE_OUTCOME_PASS = 1;
  ORACLE_OUTCOME_FAIL = 2;
  ORACLE_OUTCOME_SKIPPED = 3;
  ORACLE_OUTCOME_ERROR = 4;
}

message OracleMetric {
  string property = 1;
  double value = 2;
  string unit = 3;
  optional double uncertainty = 4;
}

// OracleEvaluation represents a single oracle evaluation.
message OracleEvaluation {
  string oracle_name = 1;               // "boltz2", "diffdock_l", "gnina", etc.
  string molecule_smiles = 2;
  OracleLevel level = 3;
  map<string, double> scores = 4;       // Property → score
  map<string, double> uncertainties = 5; // Property → uncertainty (std dev)
  int64 elapsed_ms = 6;
  bool success = 7;
  optional string error_message = 8;
  OracleOutcome outcome = 9;
  string oracle_version = 10;
  string model_version = 11;
  repeated moleculeforge.v1.core.ArtifactRef artifact_refs = 12;
  string evidence_id = 13;
  repeated OracleMetric metrics = 14;
  string error_code = 15;
}

// OracleBatchRequest is a batch evaluation request.
message OracleBatchRequest {
  string project_id = 1;
  repeated string molecule_smiles = 2;
  OracleLevel level = 3;
  repeated string requested_properties = 4;
  bool return_uncertainty = 5;
  string receptor_uri = 6;
  string protein_pdb_id = 7;
  string reference_ligand_smiles = 8;
  map<string, string> oracle_parameters = 9;
  string request_id = 10;
}

// OracleBatchResponse contains batch evaluation results.
message OracleBatchResponse {
  repeated OracleEvaluation evaluations = 1;
  string batch_id = 2;
  int64 total_elapsed_ms = 3;
}

service OracleService {
  rpc Evaluate(OracleBatchRequest) returns (OracleBatchResponse);
  rpc PredictWithUncertainty(OracleBatchRequest) returns (OracleBatchResponse);
  rpc StreamEvaluate(stream OracleBatchRequest) returns (stream OracleBatchResponse);
}
