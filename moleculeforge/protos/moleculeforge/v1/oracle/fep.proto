syntax = "proto3";

package moleculeforge.v1.oracle;

// FEPResult represents an alchemical free energy perturbation result.
message FEPResult {
  string ligand_a_smiles = 1;           // Reference ligand
  string ligand_b_smiles = 2;           // Test ligand
  double ddg_kcal_mol = 3;              // Relative binding free energy ΔΔG
  double ddg_uncertainty = 4;           // BAR/MBAR uncertainty
  int32 n_repeats = 5;                  // Number of independent FEP repeats
  string method = 6;                    // "openfe", "fep+", "somd"
  map<string, double> per_repeat_ddg = 7;
  bool converged = 8;
}

message FEPBatchRequest {
  string project_id = 1;
  string protein_pdb_id = 2;
  string reference_ligand_smiles = 3;
  repeated string test_ligand_smiles = 4;
  string method = 5;                    // "openfe" (default)
  int32 n_repeats = 6;
}

message FEPBatchResponse {
  repeated FEPResult results = 1;
  string batch_id = 2;
  int64 total_elapsed_ms = 3;
}

message FEPJobStatusRequest {
  string job_id = 1;
}

message FEPJobStatus {
  string job_id = 1;
  string state = 2;                    // "queued", "running", "completed", "failed"
  FEPBatchResponse response = 3;
  string error = 4;
  int64 submitted_at_ms = 5;
  int64 started_at_ms = 6;
  int64 completed_at_ms = 7;
}

service FEPService {
  rpc RunFEP(FEPBatchRequest) returns (FEPBatchResponse);
  rpc SubmitFEP(FEPBatchRequest) returns (FEPJobStatus);
  rpc GetStatus(FEPJobStatusRequest) returns (FEPJobStatus);
}
