syntax = "proto3";

package moleculeforge.v1.oracle;

message AvailabilityRequest {
  string smiles = 1;
  string request_id = 2;
}

message AvailabilityResponse {
  string smiles = 1;
  bool available = 2;
  string catalog_id = 3;
  string catalog_source = 4;
  string source_timestamp = 5;
  optional double price = 6;
  string currency = 7;
  optional uint32 lead_time_days = 8;
  string evidence_id = 9;
  string catalog_version = 10;
  string catalog_checksum = 11;
}

message BatchAvailabilityRequest {
  repeated AvailabilityRequest requests = 1;
  string request_id = 2;
}

message BatchAvailabilityResponse {
  repeated AvailabilityResponse results = 1;
  int64 total_elapsed_ms = 2;
  string request_id = 3;
}

message CatalogPriceRequest {
  string smiles = 1;
  string catalog_id = 2;
  string request_id = 3;
}

service SupplyOracleService {
  rpc CheckAvailability(AvailabilityRequest) returns (AvailabilityResponse);
  rpc BatchCheck(BatchAvailabilityRequest) returns (BatchAvailabilityResponse);
  rpc GetCatalogPrice(CatalogPriceRequest) returns (AvailabilityResponse);
}
