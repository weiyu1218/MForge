[project]
name = "moleculeforge"
version = "0.1.0"
description = "End-to-end molecular inverse design platform"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "MoleculeForge Team" }]

dependencies = []

[project.optional-dependencies]
agent-runtime = [
    "api-gateway",
    "cig-compiler-svc",
    "critic-svc",
    "feature-store-svc",
    "humu-index-svc",
    "nl2obj",
    "nl2obj-svc",
    "generator-coord",
    "generator-router-svc",
    "orchestrator-svc",
    "pareto-bo",
    "validation-agent",
    "retrosyn-agent",
    "supply-agent",
    "srb-agent",
    "critic-agent",
    "provenance-svc",
    "fastapi>=0.110",
    "langchain>=0.3",
    "pydantic-settings>=2.3",
    "uvicorn>=0.29",
]
oracle-runtime = [
    "admet-svc",
    "boltz2-svc",
    "dock-svc",
    "fep-svc",
    "mf-retrosyn-rsgpt",
    "mf-retrosyn-ualign",
    "retrosyn-svc",
    "supply-oracle-svc",
]
generator-runtime = [
    "crem-generator-svc",
    "fragfm-generator-svc",
    "hfm-generator-svc",
    "humu-encoder-svc",
    "iclm-svc",
    "mmpt-generator-svc",
    "uas-generator-svc",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "pre-commit>=3.7",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.uv.workspace]
members = [
    "libs/*",
    "models/mf-generators/*",
    "models/mf-oracles/*",
    "models/mf-retrosyn/*",
    "models/mf-encoders/*",
    "services/*",
    "agents/*",
    "pipelines/*",
    "wetlab/*",
]

[tool.uv.sources]
mf-core = { workspace = true }
mf-humu = { workspace = true }
mf-chem = { workspace = true }
mf-agents = { workspace = true }
mf-eval = { workspace = true }
mf-telemetry = { workspace = true }
# ── Models ──
mf-generators-hfm-3d = { workspace = true }
mf-generators-fragfm = { workspace = true }
mf-generators-crem-3d = { workspace = true }
mf-generators-mmpt-rag = { workspace = true }
mf-generators-incremental-clm = { workspace = true }
mf-generators-uas = { workspace = true }
mf-generators-rdkit-random = { workspace = true }
mf-oracles-rdkit-oracle = { workspace = true }
mf-oracles-boltz2 = { workspace = true }
mf-oracles-diffdock-l = { workspace = true }
mf-oracles-gnina = { workspace = true }
mf-oracles-openfe = { workspace = true }
mf-oracles-admet-ai = { workspace = true }
mf-encoders-humu-mol = { workspace = true }
mf-encoders-humu-pocket = { workspace = true }
mf-encoders-humu-route = { workspace = true }
mf-retrosyn-aizynth = { workspace = true }
mf-retrosyn-rsgpt = { workspace = true }
mf-retrosyn-ualign = { workspace = true }
# ── Services ──
admet-svc = { workspace = true }
cig-compiler-svc = { workspace = true }
humu-encoder-svc = { workspace = true }
api-gateway = { workspace = true }
boltz2-svc = { workspace = true }
crem-generator-svc = { workspace = true }
critic-svc = { workspace = true }
dock-svc = { workspace = true }
feature-store-svc = { workspace = true }
fep-svc = { workspace = true }
fragfm-generator-svc = { workspace = true }
generator-router-svc = { workspace = true }
hfm-generator-svc = { workspace = true }
humu-index-svc = { workspace = true }
iclm-svc = { workspace = true }
mmpt-generator-svc = { workspace = true }
nl2obj-svc = { workspace = true }
orchestrator-svc = { workspace = true }
provenance-svc = { workspace = true }
retrosyn-svc = { workspace = true }
supply-oracle-svc = { workspace = true }
uas-generator-svc = { workspace = true }
# ── Agents ──
orchestrator = { workspace = true }
nl2obj = { workspace = true }
validation-agent = { workspace = true }
critic-agent = { workspace = true }
supply-agent = { workspace = true }
retrosyn-agent = { workspace = true }
generator-coord = { workspace = true }
srb-agent = { workspace = true }
xdl-compiler = { workspace = true }
# ── Pipelines ──
mvp-pipeline = { workspace = true }
humu-pretrain = { workspace = true }
reaction-indexing = { workspace = true }
pareto-bo = { workspace = true }

# ----------------------------------------------------------------------------
# Lint / format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "**/proto_gen/**",
    "**/.venv/**",
    "ui/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "ANN", "S"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Type checking
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["proto_gen", ".venv", "ui"]

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_benchmark.py"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests, no I/O",
    "integration: requires docker-compose stack",
    "benchmark: benchmark suites requiring trained generators or datasets",
    "e2e: end-to-end run",
    "slow: long-running",
    "gpu: requires CUDA",
]

# ----------------------------------------------------------------------------
# Three-tier dependency discipline (enforced in CI)
# ----------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "mf_core", "mf_humu", "mf_chem", "mf_agents", "mf_eval", "mf_telemetry",
    "mf_generators", "mf_oracles", "mf_retrosyn", "mf_encoders",
    "admet_svc", "api_gateway", "boltz2_svc", "cig_compiler_svc",
    "crem_generator_svc", "critic_svc", "dock_svc", "feature_store_svc",
    "fep_svc", "fragfm_generator_svc", "generator_router_svc",
    "hfm_generator_svc", "humu_encoder_svc", "humu_index_svc", "iclm_svc",
    "mmpt_generator_svc", "nl2obj_svc", "orchestrator_svc", "provenance_svc",
    "retrosyn_svc", "supply_oracle_svc", "uas_generator_svc", "orchestrator",
    "mvp_pipeline",
    "nl2obj", "validation_agent", "critic_agent",
    "supply_agent", "retrosyn_agent", "generator_coord",
]

[[tool.importlinter.contracts]]
name = "Layered architecture: libs cannot depend on upper layers"
type = "forbidden"
source_modules = [
    "mf_core", "mf_humu", "mf_chem", "mf_agents", "mf_eval", "mf_telemetry",
]
forbidden_modules = [
    "cig_compiler_svc", "orchestrator", "mvp_pipeline",
    "mf_generators", "mf_oracles", "mf_retrosyn", "mf_encoders",
    "nl2obj", "validation_agent", "critic_agent",
    "supply_agent", "retrosyn_agent", "generator_coord",
]

[[tool.importlinter.contracts]]
name = "Service independence (services may not import other services directly)"
type = "independence"
modules = [
    "admet_svc", "api_gateway", "boltz2_svc", "cig_compiler_svc",
    "crem_generator_svc", "critic_svc", "dock_svc", "feature_store_svc",
    "fep_svc", "fragfm_generator_svc", "generator_router_svc",
    "hfm_generator_svc", "humu_encoder_svc", "humu_index_svc", "iclm_svc",
    "mmpt_generator_svc", "nl2obj_svc", "orchestrator_svc", "provenance_svc",
    "retrosyn_svc", "supply_oracle_svc", "uas_generator_svc",
]
ignore_imports = [
    "orchestrator_svc.main -> cig_compiler_svc.domain.compiler",
]

[[tool.importlinter.contracts]]
name = "Models cannot depend on services or agents"
type = "forbidden"
source_modules = ["mf_generators", "mf_oracles", "mf_retrosyn", "mf_encoders"]
forbidden_modules = ["cig_compiler_svc", "orchestrator", "mvp_pipeline"]
