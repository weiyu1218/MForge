repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: ["pydantic", "types-requests", "types-PyYAML"]
        exclude: ^(tests/|.*proto_gen/)

  - repo: local
    hooks:
      - id: import-linter
        name: Check three-tier dependency contract
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: proto-check
        name: Check protobuf consistency
        entry: bash tools/codegen/check_proto_sync.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: secrets-scan
        name: Scan for secrets
        entry: python tools/linting/secrets_scanner.py
        language: system
        pass_filenames: true
