[project]
name = "mvp-pipeline"
version = "0.1.0"
description = "MVP pipeline runner: CIC -> Generator -> Oracle -> Pareto"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-chem",
    "mf-agents",
    "mf-humu",
    "cig-compiler-svc",
    "mf-generators-rdkit-random",
    "mf-oracles-rdkit-oracle",
    "orchestrator",
]

[project.entry-points."moleculeforge.pipelines"]
mvp = "mvp_pipeline.runner:run_pipeline"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvp_pipeline"]
