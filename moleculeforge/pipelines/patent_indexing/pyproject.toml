[project]
name = "patent-indexing"
version = "0.1.0"
description = "Patent indexing pipeline: SureChEMBL/USPTO -> vector store + Dead Zone update"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_indexing"]
