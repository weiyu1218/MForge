[project]
name = "boltz2-eval"
version = "0.1.0"
description = "Boltz-2 evaluation pipeline — periodic accuracy benchmarking"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "torch>=2.6",
    "rdkit>=2024.9.5",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boltz2_eval"]
