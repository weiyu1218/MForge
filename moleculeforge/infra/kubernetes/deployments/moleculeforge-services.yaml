spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: api-gateway}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: moleculeforge}
    spec:
      containers:
        - name: api-gateway
          image: moleculeforge/agent-runtime:latest
          command: ["python", "-m", "api_gateway.main"]
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: ORCHESTRATOR_SVC_URL
              value: "http://orchestrator-svc.mf-agents.svc.cluster.local:8011"
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef: {name: api-gateway-config, key: oidc-issuer}
            - name: OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef: {name: api-gateway-config, key: oidc-audience}
            - name: OIDC_JWKS_URI
              valueFrom:
                configMapKeyRef: {name: api-gateway-config, key: oidc-jwks-uri}
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: agent-runtime-secrets, key: INTERNAL_SERVICE_TOKEN}
