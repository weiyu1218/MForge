            - name: HUMU_ENCODER_TARGET
              value: "humu-encoder-svc.mf-generators.svc.cluster.local:50051"
---
apiVersion: v1
kind: Service
metadata:
  name: retrosyn-svc
  namespace: mf-oracles
  labels: {app.kubernetes.io/name: retrosyn-svc, app.kubernetes.io/part-of: moleculeforge}
spec:
  selector: {app.kubernetes.io/name: retrosyn-svc}
  ports: [{name: grpc, port: 50057, targetPort: 50057}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-oracle-svc
  namespace: mf-oracles
  labels: {app.kubernetes.io/name: supply-oracle-svc, app.kubernetes.io/part-of: moleculeforge}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: supply-oracle-svc}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: supply-oracle-svc, app.kubernetes.io/part-of: moleculeforge}
    spec:
      containers:
        - name: supply-oracle-svc
          image: moleculeforge/oracle:latest
          command: ["python", "-m", "supply_oracle_svc.main"]
          ports: [{name: grpc, containerPort: 50059}]
          env:
            - name: SUPPLY_CATALOG_URI
              valueFrom:
                configMapKeyRef:
                  name: supply-oracle-config
                  key: catalog-uri
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - from supply_oracle_svc.main import _require_runtime; _require_runtime()
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: supply-oracle-svc
  namespace: mf-oracles
  labels: {app.kubernetes.io/name: supply-oracle-svc, app.kubernetes.io/part-of: moleculeforge}
spec:
  selector: {app.kubernetes.io/name: supply-oracle-svc}
  ports: [{name: grpc, port: 50059, targetPort: 50059}]
