apiVersion: apps/v1
kind: Deployment
metadata:
  name: admet-svc
  namespace: mf-oracles
  labels: {app.kubernetes.io/name: admet-svc, app.kubernetes.io/part-of: moleculeforge}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: admet-svc}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: admet-svc, app.kubernetes.io/part-of: moleculeforge}
    spec:
      containers:
        - name: admet-svc
          image: moleculeforge/oracle:latest
          command: ["python", "-m", "admet_svc.main"]
          ports: [{name: grpc, containerPort: 50056}]
          env:
            - name: ADMET_ORACLE_COMMAND
              valueFrom:
                configMapKeyRef:
                  name: oracle-runner-config
                  key: admet-oracle-command
            - name: ADMET_ORACLE_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: oracle-runner-config
                  key: admet-oracle-timeout-seconds
            - name: ADMET_MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: oracle-runner-config
                  key: admet-model-path
            - name: ADMET_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: oracle-runner-config
                  key: admet-service-url
            - name: ADMET_TARGETS
              valueFrom:
                configMapKeyRef:
                  name: oracle-runner-config
                  key: admet-targets
            - name: ADMET_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: oracle-runner-config
                  key: admet-batch-size
---
