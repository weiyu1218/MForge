              valueFrom:
                configMapKeyRef:
                  name: oracle-runner-config
                  key: openfe-quickrun-timeout-seconds
            - name: OPENFE_GATHER_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: oracle-runner-config
                  key: openfe-gather-timeout-seconds
            - name: OPENFE_MAX_TRANSFORMATIONS_PER_PAIR
              valueFrom:
                configMapKeyRef:
                  name: oracle-runner-config
                  key: openfe-max-transformations-per-pair
            - name: OPENFE_RESULT_REPLAY_PATH
              valueFrom:
