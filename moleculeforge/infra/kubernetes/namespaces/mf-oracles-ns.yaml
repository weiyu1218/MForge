apiVersion: v1
kind: Namespace
metadata:
  name: mf-oracles
  labels:
    app.kubernetes.io/part-of: moleculeforge
    moleculeforge.io/tier: oracles
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: oracles-quota
  namespace: mf-oracles
spec:
  hard:
    requests.nvidia.com/gpu: "15"
    limits.nvidia.com/gpu: "15"
    requests.cpu: "32"
    requests.memory: 256Gi
    limits.cpu: "64"
    limits.memory: 512Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: oracles-limits
  namespace: mf-oracles
spec:
  limits:
    - default:
        cpu: "4"
        memory: 8Gi
      defaultRequest:
        cpu: "2"
        memory: 4Gi
      type: Container
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oracles-netpol
  namespace: mf-oracles
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: moleculeforge
      ports:
        - protocol: TCP
          port: 50053    # boltz2-svc gRPC
        - protocol: TCP
          port: 50054    # dock-svc gRPC
        - protocol: TCP
          port: 50055    # fep-svc gRPC
        - protocol: TCP
          port: 50056    # admet-svc gRPC
        - protocol: TCP
          port: 50057    # retrosyn-svc gRPC
        - protocol: TCP
          port: 50059    # supply-oracle-svc gRPC
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: moleculeforge
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              moleculeforge.io/tier: data
      ports:
        - protocol: TCP
          port: 6379
