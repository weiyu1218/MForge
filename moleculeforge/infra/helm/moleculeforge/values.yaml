global:
  namespace: moleculeforge
  imageRegistry: moleculeforge
  imageTag: latest
  imagePullPolicy: IfNotPresent

configMaps:
  retrosyn-planner-config-mf-agents:
    name: retrosyn-planner-config
    namespace: mf-agents
    data:
      planner-command: ""
      planner-commands-json: ""
      rascore-planner-command: ""
      rsgpt-planner-command: python tools/retrosyn/rsgpt_planner_wrapper.py
      ualign-planner-command: python tools/retrosyn/ualign_planner_wrapper.py
      aizynth-planner-command: python tools/retrosyn/aizynth_planner_wrapper.py
      aizynth-config-path: models/artifacts/aizynthfinder/config.yml
      planner-command-timeout-seconds: "300"
  retrosyn-planner-config-mf-oracles:
    name: retrosyn-planner-config
    namespace: mf-oracles
    data:
      planner-command: ""
      planner-commands-json: ""
      rascore-planner-command: ""
      rsgpt-planner-command: python tools/retrosyn/rsgpt_planner_wrapper.py
      ualign-planner-command: python tools/retrosyn/ualign_planner_wrapper.py
      aizynth-planner-command: python tools/retrosyn/aizynth_planner_wrapper.py
      aizynth-config-path: models/artifacts/aizynthfinder/config.yml
      planner-command-timeout-seconds: "300"
  supply-oracle-config:
    name: supply-oracle-config
    namespace: mf-oracles
    data:
      catalog-uri: ""
  api-gateway-config:
    name: api-gateway-config
    namespace: mf-agents
    data:
      oidc-issuer: ""
      oidc-audience: ""
      oidc-jwks-uri: ""
  hfm-generator-config:
    name: hfm-generator-config
    namespace: mf-generators
    data:
      checkpoint-path: ""
      decoder-path: ""
      molecular-decoder-command: ""
  fragfm-generator-config:
    name: fragfm-generator-config
    namespace: mf-generators
    data:
      vocab-path: ""
      checkpoint-path: ""
      decoder-command: ""
      decoder-timeout-seconds: "300"
      rate-matrix-path: ""
      humu-curvature: "1.0"
  crem-generator-config:
    name: crem-generator-config
    namespace: mf-generators
    data:
      mmp-db-path: ""
      dock-oracle-target: ""
      pharmacophore-scorer-command: ""
      humu-scorer-command: ""
      scorer-command-timeout-seconds: "120"
  mmpt-generator-config:
    name: mmpt-generator-config
    namespace: mf-generators
    data:
      index-uri: ""
      patent-rag-command: ""
      patent-rag-timeout-seconds: "300"
      seq2seq-decoder-command: ""
      seq2seq-decoder-timeout-seconds: "300"
  iclm-generator-config:
    name: iclm-generator-config
    namespace: mf-generators
    data:
      model-path: /var/lib/moleculeforge/iclm/model
      allow-validation-model: "false"
      device: cpu
      update-command: ""
      update-timeout-seconds: "300"
      state-path: /var/lib/moleculeforge/iclm/state.json
      checkpoint-directory: /var/lib/moleculeforge/iclm/checkpoints
  humu-encoder-config:
    name: humu-encoder-config
    namespace: mf-generators
    data:
      checkpoint-path: ""
      device: cpu
      esm2-checkpoint-path: ""
      esm2-checkpoint-sha256: ""
      legacy-model-config-path: ""
  uas-generator-config:
    name: uas-generator-config
    namespace: mf-generators
    data:
      autoencoder-path: ""
      artifact-manifest-path: ""
      candidate-source-command: ""
      decoder-command: ""
      command-timeout-seconds: "30"
  oracle-runner-config-mf-oracles:
    name: oracle-runner-config
    namespace: mf-oracles
    data:
      admet-oracle-command: ""
      admet-oracle-timeout-seconds: "120"
      admet-model-path: ""
      admet-service-url: ""
      admet-targets: ""
      admet-batch-size: "64"
      dock-oracle-command: python tools/oracles/dock_oracle_wrapper.py
      dock-oracle-timeout-seconds: "120"
      gnina-binary: gnina
      diffdock-model-path: models/artifacts/diffdock
      boltz2-oracle-command: ""
      boltz2-oracle-timeout-seconds: "300"
      boltz2-protein-pdb-id: ""
      boltz2-ensemble-size: "5"
      boltz-model-path: models/artifacts/boltz-2
      boltz-input-template-dir: models/artifacts/boltz-input-templates
      boltz-work-dir: runs/boltz2
      boltz-binary: boltz
      fep-oracle-command: python tools/oracles/fep_oracle_wrapper.py
      fep-oracle-timeout-seconds: ""
      fep-reference-ligand-smiles: ""
      fep-method: openfe
      fep-n-repeats: "1"
      openfe-runner-path: python tools/oracles/openfe_json_runner.py
      openfe-runner-timeout-seconds: ""
      openfe-cli-path: /opt/openfe/bin/openfe
      openfe-quickrun-timeout-seconds: "3600"
      openfe-gather-timeout-seconds: "600"
      openfe-max-transformations-per-pair: "2"
      openfe-result-replay-path: ""
      openfe-result-registry: ""
      openfe-transformation-registry: /var/lib/moleculeforge/fep/input/transformation-registry.json
      openfe-work-dir: /var/lib/moleculeforge/fep/work
      l4-quantum-oracle-target: ""
      l4-quantum-oracle-command: ""
      l4-quantum-engine: quantum
      l4-gpu4pyscf-command: ""
      l4-orca-command: ""
  oracle-runner-config-mf-agents:
    name: oracle-runner-config
    namespace: mf-agents
    data:
      admet-oracle-command: ""
      admet-oracle-timeout-seconds: "120"
      admet-model-path: ""
      admet-service-url: ""
      admet-targets: ""
      admet-batch-size: "64"
      dock-oracle-command: python tools/oracles/dock_oracle_wrapper.py
      dock-oracle-timeout-seconds: "120"
      gnina-binary: gnina
      diffdock-model-path: models/artifacts/diffdock
      boltz2-oracle-command: ""
      boltz2-oracle-timeout-seconds: "300"
      boltz2-protein-pdb-id: ""
      boltz2-ensemble-size: "5"
      boltz-model-path: models/artifacts/boltz-2
      boltz-input-template-dir: models/artifacts/boltz-input-templates
      boltz-work-dir: runs/boltz2
      boltz-binary: boltz
      fep-oracle-command: python tools/oracles/fep_oracle_wrapper.py
      fep-oracle-timeout-seconds: ""
      fep-reference-ligand-smiles: ""
      fep-method: openfe
      fep-n-repeats: "1"
      openfe-runner-path: python tools/oracles/openfe_json_runner.py
      openfe-runner-timeout-seconds: ""
      openfe-cli-path: /opt/openfe/bin/openfe
      openfe-quickrun-timeout-seconds: "3600"
      openfe-gather-timeout-seconds: "600"
      openfe-max-transformations-per-pair: "2"
      openfe-result-replay-path: ""
      openfe-result-registry: ""
      openfe-transformation-registry: /var/lib/moleculeforge/fep/input/transformation-registry.json
      openfe-work-dir: /var/lib/moleculeforge/fep/work
      l4-quantum-oracle-target: ""
      l4-quantum-oracle-command: ""
      l4-quantum-engine: quantum
      l4-gpu4pyscf-command: ""
      l4-orca-command: ""
  cig-compiler-config:
    name: cig-compiler-config
    namespace: mf-agents
    data:
      semantic-parser-uri: ""
      semantic-parser-command: ""
      semantic-parser-timeout-seconds: "30"
      refinement-command: ""
      refinement-timeout-seconds: "60"
      hciv-checkpoint-path: ""
      chembl-target-url: ""
      chembl-target-search-url: ""
      uniprot-search-url: ""
      rcsb-search-url: ""
  feature-store-config:
    name: feature-store-config
    namespace: mf-mlops
    data:
      feast-repo-path: feature_repo
  hypseek-teacher-config:
    name: hypseek-teacher-config
    namespace: mf-agents
    data:
      teacher-source: hypseek
      teacher-version: ""
      teacher-command: ""
      teacher-timeout-seconds: "60"
  tar-proxyless-search-config:
    name: tar-proxyless-search-config
    namespace: mf-agents
    data:
      proxyless-search-command: ""
      proxyless-search-timeout-seconds: "300"
  sila2-adapter-config:
    name: sila2-adapter-config
    namespace: mf-agents
    data:
      plan-command: ""
      plan-timeout-seconds: "120"
  pareto-bo-config:
    name: pareto-bo-config
    namespace: mf-mlops
    data:
      candidate-provider: ""
      candidate-provider-command: ""
      oracle-evaluate: ""
      oracle-evaluate-command: ""
      command-timeout-seconds: "300"
  sigstore-provenance-config:
    name: sigstore-provenance-config
    namespace: mf-agents
    data:
      sign-command: python /workspace/tools/sigstore/cosign_audit_wrapper.py sign
      verify-command: python /workspace/tools/sigstore/cosign_audit_wrapper.py verify
      expected-identity: ""
      rekor-url: https://rekor.sigstore.dev
      command-timeout-seconds: "30"
      minio-endpoint-url: ""
      minio-bucket: mf-data

secrets:
  agent-runtime-secrets:
    name: agent-runtime-secrets
    namespace: mf-agents
    stringData:
      redis-url: ""
      agent-message-hmac-secret: ""
      internal-service-token: ""
      neo4j-uri: ""
      neo4j-user: ""
      neo4j-password: ""
  generator-runtime-secrets:
    name: generator-runtime-secrets
    namespace: mf-generators
    stringData:
      internal-service-token: ""
  sigstore-provenance:
    name: sigstore-provenance
    namespace: mf-agents
    stringData:
      identity-token: ""
      database-url: ""
      minio-access-key: ""
      minio-secret-key: ""

persistentVolumeClaims:
  generator-router-state:
    name: generator-router-state
    namespace: mf-agents
    accessModes: [ReadWriteOnce]
    storage: 1Gi
  orchestrator-state:
    name: orchestrator-state
    namespace: mf-agents
    accessModes: [ReadWriteOnce]
    storage: 1Gi
  generator-coord-state:
    name: generator-coord-state
    namespace: mf-agents
    accessModes: [ReadWriteOnce]
    storage: 1Gi
  iclm-state:
    name: iclm-state
    namespace: mf-generators
    accessModes: [ReadWriteOnce]
    storage: 10Gi
  fep-data:
    name: fep-data
    namespace: mf-oracles
    accessModes: [ReadWriteOnce]
    storage: 100Gi

services:
  admet-svc:
    enabled: true
    namespace: mf-oracles
    image: {repository: oracle}
    command: ["python", "-m", "admet_svc.main"]
    ports: [{name: grpc, port: 50056}]
    env:
      ADMET_ORACLE_TIMEOUT_SECONDS: "120"
      ADMET_BATCH_SIZE: "64"
    envValueFrom:
      ADMET_ORACLE_COMMAND:
        configMapKeyRef: {name: oracle-runner-config, key: admet-oracle-command}
      ADMET_MODEL_PATH:
        configMapKeyRef: {name: oracle-runner-config, key: admet-model-path}
      ADMET_SERVICE_URL:
        configMapKeyRef: {name: oracle-runner-config, key: admet-service-url}
      ADMET_TARGETS:
        configMapKeyRef: {name: oracle-runner-config, key: admet-targets}
    resources: {}
  api-gateway:
    enabled: true
    namespace: mf-agents
    image: {repository: agent-runtime}
    command: ["python", "-m", "api_gateway.main"]
    ports: [{name: http, port: 8000}]
    env:
      ORCHESTRATOR_SVC_URL: http://orchestrator-svc.mf-agents.svc.cluster.local:8011
    envValueFrom:
      OIDC_ISSUER:
        configMapKeyRef: {name: api-gateway-config, key: oidc-issuer}
      OIDC_AUDIENCE:
        configMapKeyRef: {name: api-gateway-config, key: oidc-audience}
      OIDC_JWKS_URI:
        configMapKeyRef: {name: api-gateway-config, key: oidc-jwks-uri}
      INTERNAL_SERVICE_TOKEN:
        secretKeyRef: {name: agent-runtime-secrets, key: internal-service-token}
    resources: {}
  boltz2-svc:
    enabled: true
    namespace: mf-oracles
    image: {repository: oracle}
    command: ["python", "-m", "boltz2_svc.main"]
    ports: [{name: grpc, port: 50053}]
    env:
      BOLTZ2_ORACLE_TIMEOUT_SECONDS: "300"
      BOLTZ2_ENSEMBLE_SIZE: "5"
      BOLTZ_WORK_DIR: runs/boltz2
      BOLTZ_BINARY: boltz
    envValueFrom:
      BOLTZ2_ORACLE_COMMAND:
        configMapKeyRef: {name: oracle-runner-config, key: boltz2-oracle-command}
      BOLTZ2_PROTEIN_PDB_ID:
        configMapKeyRef: {name: oracle-runner-config, key: boltz2-protein-pdb-id}
      BOLTZ_MODEL_PATH:
        configMapKeyRef: {name: oracle-runner-config, key: boltz-model-path}
      BOLTZ_INPUT_TEMPLATE_DIR:
        configMapKeyRef: {name: oracle-runner-config, key: boltz-input-template-dir}
    resources: {}
  cig-compiler-svc:
    enabled: true
    namespace: mf-agents
    image: {repository: agent-runtime}
    command: ["python", "-m", "cig_compiler_svc.main"]
    ports: [{name: grpc, port: 50061}]
    env:
      CIG_SEMANTIC_PARSER_TIMEOUT_SECONDS: "30"
      CIG_REFINEMENT_TIMEOUT_SECONDS: "60"
    envValueFrom:
      CIG_SEMANTIC_PARSER_URI:
        configMapKeyRef: {name: cig-compiler-config, key: semantic-parser-uri}
      CIG_SEMANTIC_PARSER_COMMAND:
        configMapKeyRef: {name: cig-compiler-config, key: semantic-parser-command}
      CIG_REFINEMENT_COMMAND:
        configMapKeyRef: {name: cig-compiler-config, key: refinement-command}
      HCIV_CHECKPOINT_PATH:
        configMapKeyRef: {name: cig-compiler-config, key: hciv-checkpoint-path}
      CHEMBL_TARGET_URL:
        configMapKeyRef: {name: cig-compiler-config, key: chembl-target-url}
      CHEMBL_TARGET_SEARCH_URL:
        configMapKeyRef: {name: cig-compiler-config, key: chembl-target-search-url}
      UNIPROT_SEARCH_URL:
        configMapKeyRef: {name: cig-compiler-config, key: uniprot-search-url}
      RCSB_SEARCH_URL:
        configMapKeyRef: {name: cig-compiler-config, key: rcsb-search-url}
    resources: {}
  crem-generator-svc:
    enabled: true
    namespace: mf-generators
    image: {repository: generator}
    command: ["python", "-m", "crem_generator_svc.main"]
    ports: [{name: grpc, port: 50062}]
    env:
      CREM_SCORER_COMMAND_TIMEOUT_SECONDS: "120"
    envValueFrom:
      CREM_MMP_DB_PATH:
        configMapKeyRef: {name: crem-generator-config, key: mmp-db-path}
      CREM_DOCK_ORACLE_TARGET:
        configMapKeyRef: {name: crem-generator-config, key: dock-oracle-target}
      CREM_PHARMACOPHORE_SCORER_COMMAND:
        configMapKeyRef: {name: crem-generator-config, key: pharmacophore-scorer-command}
      CREM_HUMU_SCORER_COMMAND:
        configMapKeyRef: {name: crem-generator-config, key: humu-scorer-command}
    resources: {}
  critic-svc:
    enabled: true
    namespace: mf-agents
    image: {repository: agent-runtime}
    command: ["python", "-m", "critic_svc.main"]
    ports: [{name: grpc, port: 50063}]
    resources: {}
  dock-svc:
    enabled: true
    namespace: mf-oracles
    image: {repository: oracle}
    command: ["python", "-m", "dock_svc.main"]
    ports: [{name: grpc, port: 50054}]
    env:
      DOCK_ORACLE_TIMEOUT_SECONDS: "120"
      GNINA_BINARY: gnina
    envValueFrom:
      DOCK_ORACLE_COMMAND:
        configMapKeyRef: {name: oracle-runner-config, key: dock-oracle-command}
      DIFFDOCK_MODEL_PATH:
        configMapKeyRef: {name: oracle-runner-config, key: diffdock-model-path}
    resources: {}
  feature-store-svc:
    enabled: true
    namespace: mf-mlops
    image: {repository: agent-runtime}
    command: ["python", "-m", "feature_store_svc.main"]
    ports: [{name: http, port: 8008}]
    envValueFrom:
      FEAST_REPO_PATH:
        configMapKeyRef: {name: feature-store-config, key: feast-repo-path}
    resources: {}
  fep-svc:
    enabled: true
    namespace: mf-oracles
    image:
      repository: oracle
    strategy: {type: Recreate}
    command: ["python", "-m", "fep_svc.main"]
    ports: [{name: grpc, port: 50055}]
    env:
      FEP_JOB_DIR: /var/lib/moleculeforge/fep/jobs
      FEP_MAX_CONCURRENT_JOBS: "1"
      FEP_METHOD: openfe
      FEP_N_REPEATS: "1"
    envValueFrom:
      FEP_ORACLE_COMMAND:
        configMapKeyRef: {name: oracle-runner-config, key: fep-oracle-command}
      FEP_REFERENCE_LIGAND_SMILES:
        configMapKeyRef: {name: oracle-runner-config, key: fep-reference-ligand-smiles}
      FEP_ORACLE_TIMEOUT_SECONDS:
        configMapKeyRef: {name: oracle-runner-config, key: fep-oracle-timeout-seconds}
      OPENFE_RUNNER_PATH:
        configMapKeyRef: {name: oracle-runner-config, key: openfe-runner-path}
      OPENFE_RUNNER_TIMEOUT_SECONDS:
        configMapKeyRef: {name: oracle-runner-config, key: openfe-runner-timeout-seconds}
      OPENFE_CLI_PATH:
        configMapKeyRef: {name: oracle-runner-config, key: openfe-cli-path}
      OPENFE_QUICKRUN_TIMEOUT_SECONDS:
        configMapKeyRef: {name: oracle-runner-config, key: openfe-quickrun-timeout-seconds}
      OPENFE_GATHER_TIMEOUT_SECONDS:
        configMapKeyRef: {name: oracle-runner-config, key: openfe-gather-timeout-seconds}
      OPENFE_MAX_TRANSFORMATIONS_PER_PAIR:
        configMapKeyRef: {name: oracle-runner-config, key: openfe-max-transformations-per-pair}
      OPENFE_RESULT_REPLAY_PATH:
        configMapKeyRef: {name: oracle-runner-config, key: openfe-result-replay-path}
      OPENFE_RESULT_REGISTRY:
        configMapKeyRef: {name: oracle-runner-config, key: openfe-result-registry}
      OPENFE_TRANSFORMATION_REGISTRY:
        configMapKeyRef: {name: oracle-runner-config, key: openfe-transformation-registry}
      OPENFE_WORK_DIR:
        configMapKeyRef: {name: oracle-runner-config, key: openfe-work-dir}
    volumeMounts:
      - {name: fep-data, mountPath: /var/lib/moleculeforge/fep}
    volumes:
      - name: fep-data
        persistentVolumeClaim: {claimName: fep-data}
    readinessProbe:
      exec:
        command:
          - python
          - -c
          - from fep_svc.main import _require_runtime; _require_runtime()
      initialDelaySeconds: 5
      periodSeconds: 10
    resources:
      requests:
        nvidia.com/gpu: 1
      limits:
        nvidia.com/gpu: 1
  fragfm-generator-svc:
    enabled: true
    namespace: mf-generators
    image: {repository: generator}
    command: ["python", "-m", "fragfm_generator_svc.main"]
    ports: [{name: grpc, port: 50065}]
    env:
      FRAGFM_HUMU_CURVATURE: "1.0"
      FRAGFM_CHECKPOINT_PATH: ""
    envValueFrom:
      FRAGFM_VOCAB_PATH:
        configMapKeyRef: {name: fragfm-generator-config, key: vocab-path}
      FRAGFM_DECODER_COMMAND:
        configMapKeyRef: {name: fragfm-generator-config, key: decoder-command}
      FRAGFM_DECODER_TIMEOUT_SECONDS:
        configMapKeyRef: {name: fragfm-generator-config, key: decoder-timeout-seconds}
      FRAGFM_RATE_MATRIX_PATH:
        configMapKeyRef: {name: fragfm-generator-config, key: rate-matrix-path}
    resources: {}
  generator-router-svc:
    enabled: true
    namespace: mf-agents
    image:
      repository: agent-runtime
    strategy: {type: Recreate}
    command: ["python", "-m", "generator_router_svc.main"]
    ports: [{name: grpc, port: 50052}]
    env:
      TAR_STATE_PATH: /var/lib/moleculeforge/router/state.json
      TAR_BOOTSTRAP: "true"
      TAR_PROXYLESS_SEARCH_TIMEOUT_SECONDS: "300"
    envValueFrom:
      TAR_PROXYLESS_SEARCH_COMMAND:
        configMapKeyRef: {name: tar-proxyless-search-config, key: proxyless-search-command}
    volumeMounts:
      - {name: router-state, mountPath: /var/lib/moleculeforge/router}
    volumes:
      - name: router-state
        persistentVolumeClaim: {claimName: generator-router-state}
    resources: {}
  hypseek-teacher-svc:
    enabled: true
    namespace: mf-agents
    image:
      repository: agent-runtime
    command:
      - uvicorn
      - generator_router_svc.main:hypseek_app
      - --host
      - 0.0.0.0
      - --port
      - "8012"
    ports: [{name: http, port: 8012}]
    envValueFrom:
      HYPSEEK_TEACHER_SOURCE:
        configMapKeyRef: {name: hypseek-teacher-config, key: teacher-source}
      HYPSEEK_TEACHER_VERSION:
        configMapKeyRef: {name: hypseek-teacher-config, key: teacher-version}
      HYPSEEK_TEACHER_COMMAND:
        configMapKeyRef: {name: hypseek-teacher-config, key: teacher-command}
      HYPSEEK_TEACHER_TIMEOUT_SECONDS:
        configMapKeyRef: {name: hypseek-teacher-config, key: teacher-timeout-seconds}
    readinessProbe:
      httpGet: {path: /healthz, port: http}
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet: {path: /healthz, port: http}
      periodSeconds: 30
      failureThreshold: 3
    resources: {}
  hfm-generator-svc:
    enabled: true
    namespace: mf-generators
    image: {repository: generator}
    command: ["python", "-m", "hfm_generator_svc.main"]
    ports: [{name: grpc, port: 50066}]
    envValueFrom:
      HFM_CHECKPOINT_PATH:
        configMapKeyRef: {name: hfm-generator-config, key: checkpoint-path}
      HFM_DECODER_PATH:
        configMapKeyRef: {name: hfm-generator-config, key: decoder-path}
      HFM_MOLECULAR_DECODER_COMMAND:
        configMapKeyRef: {name: hfm-generator-config, key: molecular-decoder-command}
    resources: {}
  humu-encoder-svc:
    enabled: true
    namespace: mf-generators
    image: {repository: generator}
    command: ["python", "-m", "humu_encoder_svc.main"]
    ports: [{name: grpc, port: 50051}]
    env:
      HUMU_DEVICE: cpu
    envValueFrom:
      HUMU_CHECKPOINT_PATH:
        configMapKeyRef: {name: humu-encoder-config, key: checkpoint-path}
      HUMU_ESM2_CHECKPOINT_PATH:
        configMapKeyRef: {name: humu-encoder-config, key: esm2-checkpoint-path}
      HUMU_ESM2_CHECKPOINT_SHA256:
        configMapKeyRef: {name: humu-encoder-config, key: esm2-checkpoint-sha256}
      HUMU_LEGACY_MODEL_CONFIG_PATH:
        configMapKeyRef: {name: humu-encoder-config, key: legacy-model-config-path}
    resources: {}
  humu-index-svc:
    enabled: true
    namespace: mf-mlops
    image: {repository: agent-runtime}
    command: ["python", "-m", "humu_index_svc.main"]
    ports: [{name: http, port: 8009}]
    resources: {}
  iclm-svc:
    enabled: true
    namespace: mf-generators
    image: {repository: generator}
    strategy: {type: Recreate}
    command: ["python", "-m", "iclm_svc.main"]
    ports: [{name: grpc, port: 50067}]
    env:
      ICLM_DEVICE: cpu
      ICLM_UPDATE_TIMEOUT_SECONDS: "300"
    envValueFrom:
      ICLM_MODEL_PATH:
        configMapKeyRef: {name: iclm-generator-config, key: model-path}
      ICLM_ALLOW_VALIDATION_MODEL:
        configMapKeyRef: {name: iclm-generator-config, key: allow-validation-model}
