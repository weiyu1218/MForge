[project]
name = "xdl-compiler"
version = "0.1.0"
description = "XDL 2.0 compiler: converts SSP to ChemputerXDL-compatible XML"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xdl_compiler"]
