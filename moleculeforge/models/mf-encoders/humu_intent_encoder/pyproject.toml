[project]
name = "mf-encoders-humu-intent"
version = "0.1.0"
description = "HUMU Intent Encoder: Encodes multi-objective design intents into Lorentz cones"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
    "torch>=2.6",
]

[project.entry-points."moleculeforge.encoders"]
humu_intent = "mf_encoders.humu_intent.encoder:HUMUIntentEncoder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_encoders"]
