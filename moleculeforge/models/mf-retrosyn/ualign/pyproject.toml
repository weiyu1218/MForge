[project]
name = "mf-retrosyn-ualign"
version = "0.1.0"
description = "UAlign: Sequence alignment-based retrosynthetic route planner"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "numpy",
    "ogb",
    "pandas",
    "rdkit",
    "torch",
    "torch-geometric",
]

[project.entry-points."moleculeforge.retrosyn"]
ualign = "mf_retrosyn.ualign.retrosyn:UAlignRetrosyn"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_retrosyn"]
