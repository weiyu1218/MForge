[project]
name = "mf-generators-fragfm"
version = "0.1.0"
description = "FragFM: Two-level discrete flow matching for molecular generation"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
    "mf-chem",
    "mf-encoders-humu-mol",
    "torch>=2.6",
    "rdkit",
]

[project.entry-points."moleculeforge.generators"]
fragfm = "mf_generators.fragfm.generator:FragFMGenerator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_generators"]
