[project]
name = "mf-generators-hfm-3d"
version = "0.1.0"
description = "HFM-3D: Lorentz-tangent Flow Matching molecular generator"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
    "mf-chem",
    "torch>=2.6",
    "e3nn>=0.5",
    "geoopt>=0.5",
]

[project.entry-points."moleculeforge.generators"]
hfm_3d = "mf_generators.hfm_3d.generator:HFM3DGenerator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_generators"]
