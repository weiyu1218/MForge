[project]
name = "mf-generators-incremental-clm"
version = "0.1.0"
description = "Incremental CLM: Online continual learning for SAR series refinement"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
    "mf-chem",
    "torch>=2.6",
    "rdkit",
    "transformers>=4.46,<4.47",
]

[project.entry-points."moleculeforge.generators"]
iclm = "mf_generators.incremental_clm.generator:IncrementalCLMGenerator"
incremental_clm = "mf_generators.incremental_clm.generator:IncrementalCLMGenerator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_generators"]
