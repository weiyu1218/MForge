[project]
name = "mf-generators-lamgen-3d"
version = "0.1.0"
description = "LaMGen-3D: Multi-target LLM-based 3D molecular generation"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
    "mf-chem",
    "torch>=2.6",
    "rdkit",
    "transformers>=4.40",
]

[project.entry-points."moleculeforge.generators"]
lamgen_3d = "mf_generators.lamgen_3d.generator:LaMGen3DGenerator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_generators"]
