[project]
name = "mf-oracles-diffdock-l"
version = "0.1.0"
description = "DiffDock-L: L2 confidence-based ligand docking with equivariant score model"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "numpy",
]

[project.entry-points."moleculeforge.oracles"]
diffdock_l = "mf_oracles.diffdock_l.oracle:DiffDockLOracle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_oracles"]
