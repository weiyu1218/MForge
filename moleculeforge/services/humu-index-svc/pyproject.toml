[project]
name = "humu-index-svc"
version = "0.1.0"
description = "HUMU Index Service - vector store HTTP gateway for Qdrant ANN retrieval"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12,<1.14",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "numpy>=1.26",
    "mf-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humu_index_svc"]
