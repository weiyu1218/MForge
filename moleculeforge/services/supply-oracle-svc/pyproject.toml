[project]
name = "supply-oracle-svc"
version = "0.1.0"
description = "Building block availability query service"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rdkit>=2024.9.5",
    "pandas>=2.2",
    "tables>=3.10",
    "httpx>=0.27",
    "redis>=5.0",
    "structlog>=24.1",
]

[project.entry-points."moleculeforge.services"]
supply_oracle = "supply_oracle_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supply_oracle_svc"]
