[project]
name = "dock-svc"
version = "0.1.0"
description = "Molecular docking service — GNINA + DiffDock-L (L1 Oracle)"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-chem",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rdkit>=2024.9.5",
    "httpx>=0.27",
    "redis>=5.0",
    "structlog>=24.1",
]

[project.entry-points."moleculeforge.services"]
dock = "dock_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dock_svc"]
