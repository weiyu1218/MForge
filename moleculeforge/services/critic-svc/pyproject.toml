[project]
name = "critic-svc"
version = "0.1.0"
description = "Scientific critic agent service — independent LLM review of candidate molecules"
requires-python = ">=3.11"
dependencies = [
    "critic-agent",
    "mf-core",
    "mf-agents",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "langchain>=0.3",
    "structlog>=24.1",
]

[project.entry-points."moleculeforge.services"]
critic = "critic_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/critic_svc"]
