[project]
name = "api-gateway"
version = "0.1.0"
description = "API Gateway — unified external entry point with JWT auth, rate limiting, tracing"
requires-python = ">=3.11"
dependencies = [
    "mf-chem",
    "mf-core",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "redis>=5.0",
    "sse-starlette>=2.1",
    "structlog>=24.1",
    "grpcio>=1.60",
]

[project.entry-points."moleculeforge.services"]
api_gateway = "api_gateway"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]
