[project]
name = "generator-router-svc"
version = "0.1.0"
description = "Generator routing service — task-aware routing + swarm coordination + HUMU dedup"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rdkit>=2024.9.5",
    "structlog>=24.1",
]

[project.entry-points."moleculeforge.services"]
generator_router = "generator_router_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator_router_svc"]
