[project]
name = "orchestrator-svc"
version = "0.1.0"
description = "Asynchronous full-workflow orchestration service"
requires-python = ">=3.11"
dependencies = [
    "orchestrator",
    "mf-core",
    "mf-agents",
    "mf-chem",
    "grpcio>=1.60",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.entry-points."moleculeforge.services"]
orchestrator = "orchestrator_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_svc"]
