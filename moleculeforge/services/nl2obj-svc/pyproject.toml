[project]
name = "nl2obj-svc"
version = "0.1.0"
description = "NL-to-Objective intent parsing service — wraps agents/nl2obj"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-agents",
    "nl2obj",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "langchain>=0.3",
    "sse-starlette>=2.1",
    "structlog>=24.1",
]

[project.entry-points."moleculeforge.services"]
nl2obj = "nl2obj_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2obj_svc"]
