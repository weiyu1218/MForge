[project]
name = "boltz2-svc"
version = "0.1.0"
description = "Boltz-2 protein-ligand affinity prediction service (L2 Oracle)"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "torch>=2.6",
    "rdkit>=2024.9.5",
    "structlog>=24.1",
]

[project.entry-points."moleculeforge.services"]
boltz2 = "boltz2_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boltz2_svc"]
