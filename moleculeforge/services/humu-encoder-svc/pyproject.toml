[project]
name = "humu-encoder-svc"
version = "0.1.0"
description = "HUMU encoder microservice — exposes Enc_mol/Enc_pocket/Enc_route over gRPC"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-humu",
    "mf-encoders-humu-mol",
    "mf-encoders-humu-pocket",
    "mf-encoders-humu-route",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "torch>=2.6",
    "geoopt>=0.5.1",
    "structlog>=24.1",
]

[project.entry-points."moleculeforge.services"]
humu_encoder = "humu_encoder_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humu_encoder_svc"]
