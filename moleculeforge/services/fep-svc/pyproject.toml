[project]
name = "fep-svc"
version = "0.1.0"
description = "Free Energy Perturbation service — OpenFE RBFE + MACE-OFF24 (L3 Oracle)"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rdkit>=2024.9.5",
    "redis>=5.0",
    "structlog>=24.1",
]

[project.entry-points."moleculeforge.services"]
fep = "fep_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fep_svc"]
