[project]
name = "crem-generator-svc"
version = "0.1.0"
description = "CReM-pharm-3D molecule generator service"
requires-python = ">=3.11"
dependencies = [
    "mf-chem",
    "mf-core",
    "mf-humu",
    "mf-generators-crem-3d",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "torch>=2.6",
    "rdkit>=2024.9.5",
    "structlog>=24.1",
]

[project.entry-points."moleculeforge.services"]
crem_generator = "crem_generator_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crem_generator_svc"]
