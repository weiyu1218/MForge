[project]
name = "admet-svc"
version = "0.1.0"
description = "ADMET prediction service — L0 Oracle for rapid drug-likeness filtering"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "mf-oracles-admet-ai",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rdkit>=2024.9.5",
    "onnxruntime-gpu>=1.17 ; sys_platform == 'linux'",
    "onnxruntime>=1.17 ; sys_platform == 'darwin'",
    "chemprop>=2.0",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.entry-points."moleculeforge.services"]
admet = "admet_svc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admet_svc"]
