[project]
name = "provenance-svc"
version = "0.1.0"
description = "Provenance Service: full NL-to-SSP traceability via Neo4j graph with Sigstore signatures"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.entry-points."moleculeforge.services"]
provenance = "provenance_svc.main:create_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance_svc"]
