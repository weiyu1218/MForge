[project]
name = "mf-chem"
version = "0.1.0"
description = "MoleculeForge chemistry abstraction layer over RDKit / OpenBabel / OpenFF"
requires-python = ">=3.11"
dependencies = [
    "mf-core",
    "rdkit>=2024.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
extras = ["openbabel-wheel>=3.1"]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_chem"]
