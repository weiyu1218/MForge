[project]
name = "mf-telemetry"
version = "0.1.0"
description = "Structured logging, Prometheus metrics, OpenTelemetry tracing"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_telemetry"]
