[project]
name = "mf-eval"
version = "0.1.0"
description = "Evaluation metrics for molecules, HUMU, Pareto, agents"
requires-python = ">=3.11"
dependencies = ["mf-core", "mf-humu", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_eval"]
