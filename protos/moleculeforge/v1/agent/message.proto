syntax = "proto3";

package moleculeforge.v1.agent;

// AgentMessage is the universal envelope for all inter-agent NATS communication.
message AgentMessage {
  string trace_id = 1;                  // Distributed trace ID (links all messages in a run)
  string message_id = 2;                // Unique message UUIDv7
  string sender = 3;                    // Sending agent name
  string recipient = 4;                 // Target agent name (or wildcard)
  string message_type = 5;              // "request", "response", "event", "error"
  optional string reply_to = 6;         // Subject for reply
  bytes payload = 7;                    // Serialized protobuf payload (type-specific)
  string payload_type_url = 8;          // Type URL for deserialization (Any-like)
  int64 timestamp_ns = 9;               // Send timestamp
  bytes signature = 10;                 // Sigstore signature of payload
  map<string, string> lineage = 11;     // Parent trace IDs
  int32 ttl = 12;                       // Remaining hop count (prevents infinite loops)
}

message AgentHeartbeat {
  string agent_name = 1;
  string status = 2;                    // "healthy", "degraded", "unavailable"
  double cpu_percent = 3;
  double memory_mb = 4;
  int32 active_jobs = 5;
}

message AgentCapability {
  string agent_name = 1;
  repeated string supported_actions = 2; // e.g. ["generate", "validate", "fto_check"]
  repeated string input_types = 3;
  repeated string output_types = 4;
}
